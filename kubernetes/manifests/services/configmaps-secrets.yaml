apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: trips-ticks
data:
  mongod.conf: |
    # MongoDB Configuration
    net:
      port: 27017
      bindIp: 0.0.0.0
    
    storage:
      dbPath: /data/db
      
    systemLog:
      destination: file
      path: /var/log/mongodb/mongod.log
      logAppend: true
      
    security:
      authorization: enabled
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: trips-ticks
type: Opaque
stringData:
  root-username: admin
  root-password: changeme
  database-name: myapp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: trips-ticks
data:
  postgresql.conf: |
    # PostgreSQL Configuration
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 256MB
    effective_cache_size = 1GB
    work_mem = 16MB
    log_statement = 'all'
    log_directory = '/var/log/postgresql'
  
  pg_hba.conf: |
    # PostgreSQL Host-Based Authentication
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            md5
    host    all             all             ::1/128                 md5
    host    all             all             0.0.0.0/0               md5
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: trips-ticks
type: Opaque
stringData:
  admin-user: postgres
  admin-password: postgres
  airflow-user: airflow
  airflow-password: airflow
  airflow-database: airflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: trips-ticks
data:
  airflow.cfg: |
    [core]
    dags_folder = /home/airflow/dags
    logs_folder = /home/airflow/logs
    executor = LocalExecutor
    sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    
    [webserver]
    web_server_port = 8080
    enable_proxy_fix = True
    
    [logging]
    log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-credentials
  namespace: trips-ticks
type: Opaque
stringData:
  fernet-key: PLACEHOLDER_CHANGE_THIS
  webserver-secret-key: PLACEHOLDER_CHANGE_THIS
